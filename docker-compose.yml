services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: guayaba-velez:latest
    container_name: guayaba-velez
    restart: unless-stopped

    # Sin "ports": el proxy de Coolify llega al contenedor por la red interna
    # (puerto 8000), así que no se publica nada en el host. Publicar el 8000
    # chocaba con otro servicio del servidor ("port is already allocated").
    # Para acceso directo fuera de Coolify, usa docker-compose.local.yml.
    expose:
      - "8000"

    environment:
      # OBLIGATORIO definirla en Coolify. Genera una con:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: "${SECRET_KEY:?define SECRET_KEY en las variables de entorno de Coolify}"
      # Cuatro barras = ruta absoluta. Dos barras = ruta relativa al proyecto.
      DATABASE_URL: "sqlite:////app/instance/guayaba.db"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?define ADMIN_PASSWORD en las variables de entorno de Coolify}"

    volumes:
      # Base de datos SQLite: sobrevive a redeploys y reinicios.
      - db_data:/app/instance
      # Logos subidos desde el panel: sobreviven a redeploys.
      - uploads:/app/app/static/uploads

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads:
