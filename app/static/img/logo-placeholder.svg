<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88" role="img" aria-label="Guayaba Veleña">
  <defs>
    <linearGradient id="gv-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5a27"/>
      <stop offset="1" stop-color="#5a9e4f"/>
    </linearGradient>
    <linearGradient id="gv-fruto" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3f7e8"/>
      <stop offset="0.5" stop-color="#d8e8b4"/>
      <stop offset="0.78" stop-color="#e8c4b8"/>
      <stop offset="1" stop-color="#d4997a"/>
